server {
    listen 80;
    server_name _;
    server_tokens off;
    root /var/www/frontend;
    index index.html;
    client_max_body_size 120m;
    client_body_timeout 180s;

    location = /api { include /etc/nginx/site-inspection-fastcgi.conf; }
    location ^~ /api/ { include /etc/nginx/site-inspection-fastcgi.conf; }
    location = /up { include /etc/nginx/site-inspection-fastcgi.conf; }

    location = /storage { return 404; }
    location ^~ /storage/ {
        alias /var/www/photos/;
        autoindex off;
        disable_symlinks on;
    }
    location ^~ /assets/ { try_files $uri =404; }
    location ~ (^|/)\. { return 404; }
    location ~ \.php(?:/|$) { return 404; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }

    error_page 413 = @upload_too_large;
    location @upload_too_large {
        default_type application/json;
        return 413 '{"data":null,"message":"上傳內容超過伺服器限制。","errors":{}}';
    }
}
