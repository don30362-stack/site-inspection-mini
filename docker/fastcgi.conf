include fastcgi_params;
fastcgi_pass php:9000;
fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
# Nginx supplies its actual socket peer; never trust client forwarding claims.
fastcgi_param REMOTE_ADDR $remote_addr;
fastcgi_param HTTP_X_FORWARDED_FOR "";
fastcgi_param HTTP_FORWARDED "";
fastcgi_param HTTP_PROXY "";
fastcgi_read_timeout 240s;
