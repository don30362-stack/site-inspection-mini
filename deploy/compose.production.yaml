name: site-inspection-mini

services:
  php:
    image: ghcr.io/don30362-stack/site-inspection-mini-php:${SITE_IMAGE_TAG:-latest}
    env_file:
      - path: ./app.env
        required: false
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/lib/site-inspection/database.sqlite
      DB_URL: ""
      CACHE_STORE: file
      RATE_LIMITER_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
      TRUSTED_PROXIES: ""
    volumes:
      - sqlite:/var/lib/site-inspection
      - storage:/var/www/backend/storage
      - photos:/var/www/backend/storage/app/public
    healthcheck:
      test: [ "CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);" ]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  nginx:
    image: ghcr.io/don30362-stack/site-inspection-mini-nginx:${SITE_IMAGE_TAG:-latest}
    networks:
      default: {}
      inspection_ingress:
        aliases:
          - site-inspection-upstream
    depends_on:
      php:
        condition: service_healthy
    ports:
      - "127.0.0.1:18082:80"
    volumes:
      - photos:/var/www/photos:ro
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      - nginx
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default: {}
    restart: unless-stopped

volumes:
  sqlite:
  storage:
  photos:
  caddy_data:
  caddy_config:

networks:
  inspection_ingress:
    external: true
    name: site-inspection-ingress
