name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Laravel Tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite, sqlite3, fileinfo, dom, xml, zip
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test
      - run: vendor/bin/pint --test

  frontend:
    name: Vue Tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run type-check
      - run: npm run build

  publish:
    name: Publish Docker Images
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push PHP
        uses: docker/build-push-action@v7
        with:
          context: .
          target: php
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/don30362-stack/site-inspection-mini
          tags: |
            ghcr.io/don30362-stack/site-inspection-mini-php:${{ github.sha }}
            ghcr.io/don30362-stack/site-inspection-mini-php:latest

      - name: Build and push Nginx
        uses: docker/build-push-action@v7
        with:
          context: .
          target: nginx
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/don30362-stack/site-inspection-mini
          tags: |
            ghcr.io/don30362-stack/site-inspection-mini-nginx:${{ github.sha }}
            ghcr.io/don30362-stack/site-inspection-mini-nginx:latest
